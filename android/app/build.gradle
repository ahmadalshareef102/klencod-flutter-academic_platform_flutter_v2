plugins {
    id "com.android.application"
    id "kotlin-android"
    // يجب أن يأتي ملحق Flutter بعد ملحقي Android وKotlin
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.academic_platform"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.academic_platform"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // توقيع تجريبي (debug) ليعمل أمر flutter run --release؛ للنشر استبدله بمفتاح خاص
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
