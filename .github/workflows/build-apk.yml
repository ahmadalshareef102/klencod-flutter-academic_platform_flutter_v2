name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter source files found."

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name academic_platform .

      - name: Set Arabic app name
        run: |
          sed -i 's|android:label="[^"]*"|android:label="المنصة الأكاديمية"|' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Verify Android Gradle files
        run: |
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          echo "Android Gradle files found."

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze Flutter source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Verify Supabase build secret
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_ANON_KEY" || (echo 'Missing GitHub Actions secret SUPABASE_ANON_KEY' && exit 1)
          echo 'Supabase public client key is configured.'

      - name: Build release APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \\
            --dart-define=SUPABASE_URL="https://lpitsicjlqimkpgjiggd.supabase.co" \\
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: academic-platform-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
